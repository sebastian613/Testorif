name: Deploy to GitHub Pages

# Publishes the app (a fully static site — no build step) to GitHub Pages
# on every push to main. Runs on main specifically because GitHub's
# auto-created "github-pages" deployment environment defaults to allowing
# only the repository's default branch — deploying from any other branch
# is rejected before the job even starts, with no useful log output.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the files the app serves
        # Publishes just the runtime app — not tests/, scripts/, package.json,
        # etc. — so the public site doesn't also expose unrelated repo files.
        run: |
          mkdir _site
          cp index.html style.css manifest.webmanifest _site/
          cp -r assets data src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
